<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lino - 命式・AI人相占いマッチング</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-black: #050608;
            --bg-container: #0a0c10;
            --gold-start: #e2b740;
            --gold-end: #c49619;
            --gold-gradient: linear-gradient(135deg, var(--gold-start) 0%, var(--gold-end) 100%);
            --mint: #00e6a8;
            --text-white: #ffffff;
            --text-muted: #8c93a4;
            --text-gold: #ffca28;
            --font-cursive: 'Caveat', cursive;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: #000; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
        .app-frame { width: 100%; max-width: 414px; height: 100%; background: var(--bg-container); border-radius: 40px; display: flex; flex-direction: column; overflow: hidden; position: relative; }
        .app-header { height: 64px; padding: 0 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .brand-logo { font-family: var(--font-cursive); font-size: 32px; font-weight: 700; background: var(--gold-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .app-main { flex: 1; overflow-y: auto; padding: 20px; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        /* マッチングカード */
        .match-card { background: #0f131c; border-radius: 20px; padding: 20px; border: 1px solid #1a202c; color: #fff; }
        .avatar-inner { width: 100px; height: 100px; background: #202634; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 50px; margin: 0 auto 20px; border: 2px solid var(--mint); }
        .btn-like { width: 100%; padding: 15px; border: none; border-radius: 30px; background: var(--gold-gradient); font-weight: bold; cursor: pointer; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="app-frame">
        <header class="app-header">
            <div class="brand-logo">Lino</div>
        </header>
        <main class="app-main" id="main-content">
            <!-- メインコンテンツ領域 -->
            <section id="tab-search" class="tab-content active">
                <div id="card-wrapper">
                    <div class="match-card">
                        <div class="avatar-inner">✨</div>
                        <h2 style="text-align:center;">美咲 (27)</h2>
                        <p style="text-align:center; color:var(--mint); margin-top:10px;">命式相性: 95%</p>
                        <button class="btn-like" onclick="alert('運命のいいね！を送りました')">運命のいいね！を送る</button>
                    </div>
                </div>
            </section>
        </main>
    </div>
    <script>
        // 基本操作ロジック
        function openCustomAlert(msg) { alert(msg); }
        // ここに将来的にカードスワイプや占い詳細のJSロジックを追加・更新していく
    </script>
</body>
</html>
