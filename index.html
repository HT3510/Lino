<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Lino - 運命のマッチング</title>
  <style>
    /* ==========================================================================
       1. 基本変数・カラーパレット定義
       ========================================================================== */
    :root {
      --color-bg-main: #050608;
      --color-bg-container: #0a0c10;
      --color-card-dark: #0f131c;
      --color-card-border: #1a202c;
      --color-purple-bg: #2e1a47;
      --color-purple-border: #4a2d73;
      --color-mint: #00e6a8;
      --color-gold-start: #e2b740;
      --color-gold-end: #c49619;
      --color-text-primary: #ffffff;
      --color-text-secondary: #8c93a4;
      --color-text-gold: #ffca28;
      --color-alert-bg: #1e222d;
      --color-alert-btn: #8ab4f8;
      --font-family-base: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      --font-family-serif: 'Georgia', serif;
    }

    /* ==========================================================================
       2. リセット CSS & 全体レイアウト設定
       ========================================================================== */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: var(--font-family-base);
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: #000000;
      color: var(--color-text-primary);
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    /* アプリビューポート（iPhone型フレーム） */
    .app-frame {
      width: 100%;
      max-width: 414px;
      height: 100%;
      max-height: 844px;
      background-color: var(--color-bg-container);
      border-radius: 40px;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.95);
      border: 1px solid #1a1f2c;
    }

    /* ==========================================================================
       3. ヘッダーエリア
       ========================================================================== */
    .app-header {
      width: 100%;
      height: 64px;
      padding: 0 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: var(--color-bg-container);
      z-index: 100;
      border-bottom: 1px solid rgba(255, 255, 255, 0.03);
    }

    .brand-logo {
      font-family: var(--font-family-serif);
      font-size: 32px;
      font-style: italic;
      font-weight: bold;
      background: linear-gradient(135deg, #ffe082 0%, #c49619 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -0.5px;
    }

    .header-notification {
      width: 36px;
      height: 36px;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
    }

    .bell-icon {
      font-size: 20px;
      color: var(--color-text-gold);
    }

    /* ==========================================================================
       4. メインコンテンツ（スクロール可能エリア）
       ========================================================================== */
    .app-main {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
      position: relative;
    }

    .app-main::-webkit-scrollbar {
      display: none;
    }

    .tab-content {
      display: none;
      width: 100%;
      height: 100%;
    }

    .tab-content.active {
      display: block;
    }

    /* ==========================================================================
       5. タブ1: 「さがす」画面スタイル
       ========================================================================== */
    .odekake-container {
      background-color: #0e111a;
      border-radius: 20px;
      padding: 16px;
      margin-bottom: 20px;
      border: 1px solid var(--color-card-border);
    }

    .odekake-header {
      font-size: 13px;
      color: var(--color-text-primary);
      font-weight: bold;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .odekake-tags-wrapper {
      display: flex;
      gap: 10px;
      overflow-x: auto;
    }

    .odekake-tag {
      background-color: #102620;
      border: 1px solid #164235;
      color: var(--color-mint);
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: bold;
      white-space: nowrap;
      cursor: pointer;
    }

    .odekake-tag.disabled {
      background-color: #141722;
      border-color: #1e2434;
      color: var(--color-text-secondary);
    }

    /* ユーザー対戦・マッチカード */
    .match-card-wrapper {
      width: 100%;
      position: relative;
    }

    .match-card {
      background: linear-gradient(180deg, #09221a 0%, #0c1017 50%, #101420 100%);
      border-radius: 28px;
      border: 1px solid #153b2f;
      overflow: hidden;
      position: relative;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
      transition: all 0.35s cubic-bezier(0.25, 1, 0.5, 1);
    }

    .match-badge-container {
      padding: 14px 16px 0;
    }

    .match-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: rgba(0, 0, 0, 0.45);
      color: #ffc107;
      font-size: 12px;
      font-weight: bold;
      padding: 6px 12px;
      border-radius: 12px;
      backdrop-filter: blur(4px);
    }

    .card-avatar-section {
      padding: 24px 0 12px;
      display: flex;
      justify-content: center;
    }

    .avatar-inner {
      width: 100px;
      height: 100px;
      background-color: #202634;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 56px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.5);
    }

    .card-info-section {
      padding: 12px 20px 24px;
      text-align: left;
    }

    .user-name-text {
      font-size: 24px;
      font-weight: bold;
      color: var(--color-text-primary);
      margin-bottom: 8px;
      display: flex;
      align-items: baseline;
      gap: 6px;
    }

    .user-age-text {
      font-size: 16px;
      color: var(--color-text-secondary);
      font-weight: normal;
    }

    .ai-judgment-text {
      font-size: 12px;
      color: var(--color-mint);
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 500;
    }

    .button-like-submit {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 30px;
      background: linear-gradient(135deg, var(--color-gold-start) 0%, var(--color-gold-end) 100%);
      color: #000000;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(226, 183, 64, 0.3);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .button-like-submit:active {
      transform: scale(0.97);
      box-shadow: 0 2px 10px rgba(226, 183, 64, 0.2);
    }

    .no-more-cards {
      display: none;
      text-align: center;
      padding: 100px 20px;
      color: var(--color-text-secondary);
    }

    .no-more-cards p {
      font-size: 15px;
      line-height: 1.6;
    }

    /* ==========================================================================
       6. タブ4: 「マイページ」画面スタイル（編集フォーム含む）
       ========================================================================== */
    .mypage-card-meishiki {
      background: linear-gradient(135deg, var(--color-purple-bg) 0%, #1e1030 100%);
      border-radius: 24px;
      padding: 24px;
      margin-bottom: 20px;
      border: 1px solid var(--color-purple-border);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
    }

    .mypage-card-meishiki h2 {
      font-size: 20px;
      color: var(--color-text-primary);
      margin-bottom: 10px;
      font-weight: bold;
    }

    .mypage-card-meishiki p {
      font-size: 14px;
      color: #d8c8ed;
      line-height: 1.5;
    }

    .mypage-edit-container {
      background-color: var(--color-card-dark);
      border-radius: 24px;
      padding: 24px;
      border: 1px solid var(--color-card-border);
    }

    .mypage-edit-container h3 {
      font-size: 16px;
      color: var(--color-text-gold);
      margin-bottom: 20px;
      font-weight: bold;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .form-field-group {
      margin-bottom: 18px;
    }

    .form-field-group label {
      display: block;
      font-size: 12px;
      color: var(--color-text-secondary);
      margin-bottom: 8px;
      font-weight: bold;
    }

    .form-field-group input {
      width: 100%;
      padding: 14px 16px;
      border-radius: 12px;
      border: 1px solid #252c3d;
      background-color: #06080c;
      color: var(--color-text-primary);
      font-size: 15px;
      transition: border-color 0.2s ease;
    }

    .form-field-group input:focus {
      outline: none;
      border-color: var(--color-gold-start);
    }

    .button-save-profile {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 12px;
      background-color: #198754;
      color: var(--color-text-primary);
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
      transition: background-color 0.2s ease;
    }

    .button-save-profile:active {
      background-color: #146c43;
    }

    /* その他のプレースホルダータブ */
    .tab-placeholder {
      text-align: center;
      padding: 100px 20px;
      color: var(--color-text-secondary);
    }

    .tab-placeholder h3 {
      font-size: 18px;
      color: var(--color-text-primary);
      margin-bottom: 10px;
    }

    /* ==========================================================================
       7. アラートポップアップ（Modal）スタイル
       ========================================================================== */
    .alert-modal-overlay {
      display: none;
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.65);
      z-index: 9999;
      justify-content: center;
      align-items: flex-start;
      padding-top: 50px;
      backdrop-filter: blur(2px);
    }

    .alert-modal-content {
      background-color: var(--color-alert-bg);
      border-radius: 20px;
      width: 86%;
      padding: 20px 24px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.8);
      border: 1px solid #2d3446;
      animation: alertPop 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @keyframes alertPop {
      0% { transform: scale(0.9); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    .alert-domain {
      font-size: 12px;
      color: var(--color-text-secondary);
      margin-bottom: 12px;
      font-family: monospace;
    }

    .alert-message-text {
      font-size: 15px;
      color: var(--color-text-primary);
      margin-bottom: 24px;
      font-weight: 500;
      line-height: 1.4;
    }

    .alert-action-row {
      display: flex;
      justify-content: flex-end;
    }

    .alert-confirm-btn {
      background-color: var(--color-alert-btn);
      color: #101216;
      border: none;
      padding: 9px 26px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
    }

    /* ==========================================================================
       8. フッターナビゲーションバー
       ========================================================================== */
    .app-bottom-nav {
      height: 76px;
      background-color: var(--color-bg-container);
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      display: flex;
      justify-content: space-around;
      align-items: center;
      position: relative;
      padding-bottom: 10px;
      z-index: 100;
    }

    .nav-button {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 20%;
      height: 100%;
      background: none;
      border: none;
      color: var(--color-text-secondary);
      font-size: 10px;
      cursor: pointer;
      gap: 4px;
    }

    .nav-button.active {
      color: var(--color-mint);
    }

    .nav-icon-text {
      font-size: 22px;
    }

    .nav-center-button {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--color-gold-start) 0%, var(--color-gold-end) 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      margin-top: -32px;
      box-shadow: 0 0 20px rgba(226, 183, 64, 0.4);
      border: 4px solid var(--color-bg-container);
      cursor: pointer;
    }

    .nav-center-button span {
      font-family: var(--font-family-serif);
      font-style: italic;
      font-weight: bold;
      color: #000000;
      font-size: 15px;
    }
  </style>
</head>
<body>

  <!-- スマホ風枠組み -->
  <div class="app-frame">

    <!-- 共通ヘッダー -->
    <header class="app-header">
      <div class="brand-logo">Lino</div>
      <div class="header-notification">
        <span class="bell-icon">🔔</span>
      </div>
    </header>

    <!-- スクロールメイン領域 -->
    <main class="app-main">

      <!-- ==========================================
           タブ1: さがす（メインカード表示）
           ========================================== -->
      <section id="tab-search" class="tab-content active">
        
        <!-- おでかけ条件チップ -->
        <div class="odekake-container">
          <div class="odekake-header">
            <span>📍 今日の運命のおでかけ</span>
          </div>
          <div class="odekake-tags-wrapper">
            <div class="odekake-tag">今夜サクッと飲み 🍻</div>
            <div class="odekake-tag disabled">週末カフェ巡り ☕</div>
          </div>
        </div>

        <!-- カードコンテナ -->
        <div class="match-card-wrapper" id="card-wrapper">
          <div class="match-card" id="user-card-ayaka">
            <div class="match-badge-container">
              <div class="match-badge">
                ✨ 命式相性 [金 × 水] 98%
              </div>
            </div>
            <div class="card-avatar-section">
              <div class="avatar-inner">👩🏻</div>
            </div>
            <div class="card-info-section">
              <div class="user-name-text">
                あやか <span class="user-age-text">(25歳)</span>
              </div>
              <div class="ai-judgment-text">
                👁️ AI人相判定: 眉間幅広（オープン・誠実相）
              </div>
              <button class="button-like-submit" onclick="onClickLike('あやか')">
                ✨ 運命のいいね！を送る
              </button>
            </div>
          </div>
        </div>

        <!-- なくなった時の案内 -->
        <div class="no-more-cards" id="no-cards-msg">
          <p>近くのお相手は全員チェック済みです！<br>また時間をおいてご確認ください。</p>
        </div>

      </section>

      <!-- ==========================================
           タブ2: いいね！
           ========================================== -->
      <section id="tab-likes" class="tab-content">
        <div class="tab-placeholder">
          <h3>いいね！一覧</h3>
          <p>送ったいいね・届いたいいねをここで確認できます。</p>
        </div>
      </section>

      <!-- ==========================================
           タブ3: メッセージ
           ========================================== -->
      <section id="tab-messages" class="tab-content">
        <div class="tab-placeholder">
          <h3>メッセージ</h3>
          <p>マッチングしたお相手とのチャット一覧です。</p>
        </div>
      </section>

      <!-- ==========================================
           タブ4: マイページ（編集機能付き）
           ========================================== -->
      <section id="tab-mypage" class="tab-content">
        
        <!-- 上部：命式プロフィールカード（リアルタイム変更領域） -->
        <div class="mypage-card-meishiki">
          <h2><span id="display-user-name">秀広</span> さんの陰陽五行・命式</h2>
          <p>日干: <span id="display-user-nikkan">甲（大木）</span> | ソウルナンバー: <span id="display-user-soul">7</span></p>
        </div>

        <!-- 下部：編集フォームエリア -->
        <div class="mypage-edit-container">
          <h3>⚙️ プロフィール編集</h3>
          
          <div class="form-field-group">
            <label for="input-name">お名前</label>
            <input type="text" id="input-name" value="秀広" placeholder="名前を入力">
          </div>

          <div class="form-field-group">
            <label for="input-nikkan">日干（属性）</label>
            <input type="text" id="input-nikkan" value="甲（大木）" placeholder="例: 甲（大木）">
          </div>

          <div class="form-field-group">
            <label for="input-soul">ソウルナンバー</label>
            <input type="text" id="input-soul" value="7" placeholder="例: 7">
          </div>

          <button class="button-save-profile" onclick="onSaveProfile()">
            設定を保存する
          </button>
        </div>

      </section>

    </main>

    <!-- 下部固定ナビゲーションバー -->
    <nav class="app-bottom-nav">
      <button class="nav-button active" onclick="switchNavTab('search', this)">
        <span class="nav-icon-text">🔍</span>
        <span>さがす</span>
      </button>

      <button class="nav-button" onclick="switchNavTab('likes', this)">
        <span class="nav-icon-text">🤍</span>
        <span>いいね！</span>
      </button>

      <div class="nav-center-button" onclick="switchNavTab('search', document.querySelectorAll('.nav-button')[0])">
        <span>Lino</span>
      </div>

      <button class="nav-button" onclick="switchNavTab('messages', this)">
        <span class="nav-icon-text">💬</span>
        <span>メッセージ</span>
      </button>

      <button class="nav-button" onclick="switchNavTab('mypage', this)">
        <span class="nav-icon-text">👤</span>
        <span>マイページ</span>
      </button>
    </nav>

    <!-- ポップアップモーダル（ht3510.github.ioのAlert再現） -->
    <div class="alert-modal-overlay" id="custom-alert-modal">
      <div class="alert-modal-content">
        <div class="alert-domain">ht3510.github.io の内容</div>
        <div class="alert-message-text" id="alert-modal-text"></div>
        <div class="alert-action-row">
          <button class="alert-confirm-btn" onclick="onCloseAlertModal()">OK</button>
        </div>
      </div>
    </div>

  </div>

  <!-- ==========================================================================
     9. JavaScript ロジック処理
     ========================================================================== -->
  <script>
    // 内部状態変数
    let currentTargetName = "";

    /**
     * 「運命のいいね！」ボタンをクリックした時の処理
     */
    function onClickLike(targetName) {
      currentTargetName = targetName;
      const modalText = `${targetName}さんに運命のいいね！を送りました！`;
      
      // カスタムモーダルを表示
      document.getElementById('alert-modal-text').textContent = modalText;
      document.getElementById('custom-alert-modal').style.display = 'flex';
    }

    /**
     * ポップアップの「OK」ボタンを押したときの処理（カード消去）
     */
    function onCloseAlertModal() {
      // モーダルを閉じる
      document.getElementById('custom-alert-modal').style.display = 'none';

      // 対象のカード（あやかさん）が存在すればアニメーションして消去
      const cardElement = document.getElementById('user-card-ayaka');
      if (cardElement) {
        cardElement.style.opacity = '0';
        cardElement.style.transform = 'translateY(-20px)';

        setTimeout(() => {
          cardElement.style.display = 'none';
          // メッセージを表示
          document.getElementById('no-cards-msg').style.display = 'block';
        }, 300);
      }
    }

    /**
     * タブ切り替え処理
     */
    function switchNavTab(tabKey, element) {
      // 全タブページを非表示
      const tabPages = document.querySelectorAll('.tab-content');
      tabPages.forEach(page => page.classList.remove('active'));

      // 全ナビボタンのハイライト解除
      const navButtons = document.querySelectorAll('.nav-button');
      navButtons.forEach(btn => btn.classList.remove('active'));

      // 選択タブの有効化
      document.getElementById(`tab-${tabKey}`).classList.add('active');

      if (element) {
        element.classList.add('active');
      }
    }

    /**
     * マイページの「設定を保存する」ボタンを押したときの処理
     */
    function onSaveProfile() {
      // 入力値の取得
      const nameVal = document.getElementById('input-name').value;
      const nikkanVal = document.getElementById('input-nikkan').value;
      const soulVal = document.getElementById('input-soul').value;

      // カードの表示テキストを更新
      document.getElementById('display-user-name').textContent = nameVal;
      document.getElementById('display-user-nikkan').textContent = nikkanVal;
      document.getElementById('display-user-soul').textContent = soulVal;

      // 保存完了の案内ポップアップ表示
      document.getElementById('alert-modal-text').textContent = "プロフィール情報を保存・反映しました！";
      document.getElementById('custom-alert-modal').style.display = 'flex';
    }
  </script>

</body>
</html>
